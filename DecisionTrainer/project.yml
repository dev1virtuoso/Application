name: DecisionTrainer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DecisionTrainer:
    type: application
    platform: macOS
    sources:
      - path: Sources/DecisionTrainer
      - path: Sources/DecisionTrainerCore
    settings:
      base:
        PRODUCT_NAME: DecisionTrainer
        PRODUCT_BUNDLE_IDENTIFIER: com.example.decisiontrainer
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: Decision Trainer
        CFBundleDisplayName: Decision Trainer
        CFBundleExecutable: DecisionTrainer
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.education
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""

schemes:
  DecisionTrainer:
    build:
      targets:
        DecisionTrainer: all
    run:
      config: Debug
    archive:
      config: Release
